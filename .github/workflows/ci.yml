# Checks every push and pull request; on `main`, also builds the production image and
# publishes it to the GitHub Container Registry (ghcr.io/<owner>/askmydocs-api).
#
# Actions are pinned to a commit (the version is in the comment) so a changed tag cannot
# run different code; Dependabot proposes updates (.github/dependabot.yml).
# No secrets are needed: the tests fake every OpenAI call.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel outdated runs of a pull request, never a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and code style
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Same database image as development and production; created empty for every run.
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: askmydocs_test
          POSTGRES_USER: askmydocs
          POSTGRES_PASSWORD: askmydocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askmydocs -d askmydocs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Real environment variables take precedence over .env (copied from .env.example).
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: askmydocs
      DB_PASSWORD: askmydocs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, zip, bcmath, pcntl
          coverage: none
          tools: composer:v2

      - name: Install Poppler (PDF text extraction)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Find the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test

      # Production packages only: development tools do not reach the server.
      - name: Security advisories
        run: composer audit --no-dev

  image:
    name: Production image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry names must be lowercase.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/askmydocs-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the full commit SHA (to deploy or roll back an exact version) and "latest".
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
