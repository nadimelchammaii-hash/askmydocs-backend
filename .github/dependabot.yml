# Weekly update pull requests; CI tests each one before you merge it.
# cooldown: only versions released at least 14 days ago are proposed (security fixes
# are not delayed). Minor and patch updates are grouped into one pull request.

version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfiles (production and development).
  - package-ecosystem: docker
    directories:
      - /docker/prod
      - /docker/php
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  # Images in compose.yaml and compose.prod.yaml (PostgreSQL + pgvector, Mailpit).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
