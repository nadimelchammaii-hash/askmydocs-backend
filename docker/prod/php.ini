; Production settings for the AskMyDocs PHP containers (API, workers, scheduler).

; Uploads: PDFs up to 20 MB (validated by the app), plus room for the multipart overhead.
upload_max_filesize = 21M
post_max_size = 25M
memory_limit = 256M

; OPcache: the code never changes inside a running container, so files are compiled
; once and never checked again. A new release means a new image (and new containers).
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; Faster file lookups for the many class files of the framework.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Never show PHP's own errors in responses; Laravel handles and logs them.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; Session cookies are handled by Laravel, not by PHP's session module.
session.use_strict_mode = 1
