; PHP-FPM pool settings for the API container (added after the image's own www.conf).
[www]

; Keep the container's environment variables (DB_HOST, APP_KEY, ...): Laravel reads its
; configuration from them. FPM's default would remove them.
clear_env = no

; Workers: enough for a small deployment; each uses up to memory_limit (256M).
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Recycle workers now and then (guards against slow memory growth).
pm.max_requests = 500

; A request that runs this long is stopped (uploads run pdfinfo; answers are queued).
request_terminate_timeout = 60s

; Caddy already logs every request; PHP errors still go to stderr (docker logs).
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
