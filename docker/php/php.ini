; Development settings for the AskMyDocs PHP containers.

; Uploads: PDFs up to 20 MB (validated by the app), plus room for the multipart overhead.
upload_max_filesize = 21M
post_max_size = 25M
memory_limit = 256M

; OPcache for the CLI (artisan serve, workers): far fewer file reads on the mounted
; source folder. Timestamps are still checked on every request, so edits apply at once.
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Never show PHP's own errors in responses; Laravel handles and logs them.
display_errors = Off
log_errors = On
expose_php = Off
