# PRODUCTION stack: Caddy (HTTPS + the built SPA), PHP-FPM, queue workers, scheduler and
# PostgreSQL. Code is baked into the images (nothing is mounted from the host).
#
# Settings come from .env.production (copy .env.production.example; never commit it):
#
#   docker compose -f compose.prod.yaml --env-file .env.production build
#   docker compose -f compose.prod.yaml --env-file .env.production run --rm app php artisan migrate --force
#   docker compose -f compose.prod.yaml --env-file .env.production up -d
#
# With images published by CI (API_IMAGE/WEB_IMAGE in .env.production), use `pull`
# instead of `build`; the source of the frontend is then not needed.
#
# Migrate before `up`: the workers need the database tables (they restart until then).
#
# - The SPA repository must be next to this one: ../askmydocs-frontend
# - Only Caddy is reachable (ports 80/443). The database has no published port.
# - Mailpit is a local test inbox (http://localhost:8025), started only with
#   COMPOSE_PROFILES=mailpit. On a server, remove that line and set a real SMTP provider.
# - Backups: docker/prod/backup.sh and restore.sh.
# - Separate project name and volumes, so it can run next to the development stack.
# - On a server shared with another project (whose Caddy already owns ports 80/443), add
#   compose.shared.yaml: -f compose.prod.yaml -f compose.shared.yaml
# - Every container has a memory limit and capped logs, so this stack can never use up
#   the memory or disk of a shared server.

name: askmydocs-prod

# Container logs are rotated: at most 3 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Shared by the API, workers and scheduler. Only `app` builds the image; the others reuse it.
x-php: &php
  # API_IMAGE: an image published by CI (e.g. ghcr.io/<owner>/askmydocs-api:<commit>);
  # default: the image built locally from this repository.
  image: ${API_IMAGE:-askmydocs-api:prod}
  pull_policy: never
  restart: unless-stopped
  logging: *logging
  # Laravel reads its settings from these environment variables (there is no .env file
  # in the image). They are cached at start (`php artisan optimize` in the entrypoint).
  env_file: .env.production
  environment:
    DB_HOST: db
    DB_PORT: 5432
  volumes:
    # Uploaded PDFs: written by `app`, read by the document worker.
    - storage:/app/storage
  networks: [backend]
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    build:
      context: ../askmydocs-frontend
      dockerfile: docker/Dockerfile.prod
    # WEB_IMAGE: an image published by the frontend's CI; default: built locally.
    image: ${WEB_IMAGE:-askmydocs-web:prod}
    restart: unless-stopped
    logging: *logging
    mem_limit: 96m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env.production}
      HSTS: ${HSTS:-max-age=31536000}
      PHP_UPSTREAM: app:9000
    ports:
      - "${WEB_BIND:-127.0.0.1}:80:80"
      - "${WEB_BIND:-127.0.0.1}:443:443"
      # HTTP/3 (QUIC), which Caddy offers to browsers.
      - "${WEB_BIND:-127.0.0.1}:443:443/udp"
    volumes:
      # Certificates (and, for localhost, Caddy's own certificate authority). Kept so the
      # certificate does not change on every restart.
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy

  app:
    <<: *php
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    pull_policy: missing
    networks: [edge, backend]
    # PHP-FPM starts up to PHP_FPM_MAX_CHILDREN (default 4) workers on demand.
    mem_limit: 384m
    healthcheck:
      # PHP-FPM accepts connections on port 9000.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --max-time: restart the worker every hour (frees memory, picks up a new image).
  worker-answers:
    <<: *php
    command: ["php", "artisan", "queue:work", "--queue=answers", "--tries=3", "--max-time=3600"]
    stop_grace_period: 90s
    mem_limit: 192m

  worker-documents:
    <<: *php
    command: ["php", "artisan", "queue:work", "--queue=documents", "--tries=3", "--max-time=3600"]
    # Lets a running document job (up to 240 s) finish when the stack stops.
    stop_grace_period: 260s
    # PDF text extraction and embedding batches.
    mem_limit: 384m

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    # Runs each scheduled command as a separate PHP process.
    mem_limit: 192m

  db:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    logging: *logging
    # Memory settings for a small (possibly shared) server; PG_SHARED_BUFFERS can be raised
    # in .env.production on a bigger one (about a quarter of the memory limit).
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-64MB}
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # LOCAL TEST ONLY: catches every email. Web inbox at http://localhost:8025.
  # Starts only with COMPOSE_PROFILES=mailpit (set in .env.production for local tests).
  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: [mailpit]
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    ports:
      - "127.0.0.1:8025:8025"
    networks: [backend]

# edge: Caddy <-> PHP-FPM only. backend: PHP <-> database and mail. Caddy cannot reach
# the database.
networks:
  edge:
  backend:

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
